<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Toggle Checkbox -->
    <input type="checkbox" id="toggle" hidden>

    <!-- REGISTER -->
    <div class="form register">
      <h1>Create Account</h1>
      <p class="subtitle">Secure passwordless authentication</p>

      <input type="text" placeholder=" Enter Email " required>
      <button>Create Passkey</button>

      <p class="switch-text">
        Already registered?
        <label for="toggle">Login</label>
      </p>
    </div>

    <!-- LOGIN -->
    <div class="form login">
      <h1>Welcome Back</h1>
      <p class="subtitle">Login using your passkey</p>

      <input type="text" placeholder="Email " required>
      <button>Login with Passkey</button>

      <p class="switch-text">
        New user?
        <label for="toggle">Register</label>
      </p>
    </div>

  </div>
</div>
